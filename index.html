<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><meta name="apple-mobile-web-app-capable" content="yes"><title>CYBER SECURITY ROADMAP</title><link rel="manifest" href="manifest.webmanifest?v=11"><link rel="icon" href="icon.svg?v=11"><link rel="stylesheet" href="styles.css?v=11"><style>body{margin:0;background:#070b12;color:#f4f8ff;font-family:system-ui}#fallback{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}.fallback-box{width:min(430px,100%);background:#101827;border:1px solid #26354b;border-radius:18px;padding:24px;box-sizing:border-box}.fallback-box h1{font-size:20px}.fallback-box p{color:#9aa9bc}.fallback-box input,.fallback-box button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #30415a;background:#0a111c;color:#fff}.fallback-box button{background:#00e5ff;color:#071019;font-weight:800;border:0}.fallback-box .link{background:transparent;color:#9befff}.err{color:#ff91a8;font-size:13px;margin-top:10px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script></head><body><div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b12;color:#9befff;font-family:system-ui">جاري تشغيل Cyber Security Roadmap…</div><div id="fallback"><section class="fallback-box"><h1>CYBER SECURITY ROADMAP</h1><p>تسجيل الدخول لحفظ تقدمك ومزامنته بين أجهزتك.</p><input id="fb-email" type="email" placeholder="البريد الإلكتروني"><input id="fb-pass" type="password" placeholder="كلمة المرور — 6 أحرف على الأقل"><div id="fb-msg" class="err"></div><button id="fb-go">تسجيل الدخول</button><button id="fb-signup" class="link">ليس لديك حساب؟ إنشاء حساب</button></section></div><script src="app.js?v=11" defer></script><script defer>window.addEventListener('load',()=>{setTimeout(()=>{if(document.querySelector('.center')||document.querySelector('#app'))return;const b=document.getElementById('boot'),f=document.getElementById('fallback');if(b)b.style.display='none';if(f)f.style.display='flex';const msg=document.getElementById('fb-msg');const go=async signup=>{const email=document.getElementById('fb-email').value.trim(),password=document.getElementById('fb-pass').value;if(!window.supabase)return msg.textContent='خدمة الحسابات لم تُحمّل. جرّب تحديث الصفحة.';if(!email||password.length<6)return msg.textContent='اكتب إيميل صحيح وكلمة مرور 6 أحرف على الأقل.';const c=window.supabase.createClient('https://hlijqqugqglybrutooak.supabase.co','sb_publishable_OKCjPi6GZ7n3MLfcMyjBtw_3gHF19BI');const r=signup?await c.auth.signUp({email,password}):await c.auth.signInWithPassword({email,password});msg.textContent=r.error?r.error.message:(signup?'تم إنشاء الحساب. أكّد الإيميل إذا طُلب منك ثم سجّل الدخول.':'تم تسجيل الدخول، أعد تحميل الصفحة.');if(!r.error&&!signup)location.reload()};document.getElementById('fb-go').onclick=()=>go(false);document.getElementById('fb-signup').onclick=()=>go(true)},2500)});</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=11').catch(()=>{});</script></body></html>
